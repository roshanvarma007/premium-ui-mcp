name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Package size
        run: npm run check:size

  compose-sample:
    name: Compose sample compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble (bundled + downloadable fonts)
        working-directory: examples/compose-sample
        run: ./gradlew :app:assembleDebug --console=plain

  web-samples:
    name: Web samples (Tailwind build + CSS parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build Tailwind sample and validate generated CSS
        working-directory: examples/tailwind-sample
        run: npm ci && npm run check

  react-next-samples:
    name: React and Next.js samples build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: React (Vite) sample
        working-directory: examples/react-sample
        run: npm ci && npm run build
      - name: Next.js sample (App Router + Pages Router + Tailwind)
        working-directory: examples/nextjs-sample
        run: npm ci && npm run build

  android-xml-sample:
    name: Android XML sample builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble (bundled + downloadable fonts)
        working-directory: examples/android-xml-sample
        run: ./gradlew :app:assembleDebug --console=plain
