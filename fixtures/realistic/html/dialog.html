<dialog id="confirm" class="card" aria-labelledby="confirm-title">
  <header class="dialog-header">
    <h2 id="confirm-title" class="t-title">Cancel this transfer?</h2>
    <button type="button" class="btn btn-secondary" aria-label="Close" data-close>×</button>
  </header>
  <img src="divider.svg" alt="">
  <p class="t-body t-muted">The $250.00 transfer to Maria Chen scheduled for Friday will not be sent.</p>
  <div class="actions">
    <button type="button" class="btn btn-secondary" data-close>Keep transfer</button>
    <button type="button" class="btn btn-primary">Cancel transfer</button>
  </div>
</dialog>
