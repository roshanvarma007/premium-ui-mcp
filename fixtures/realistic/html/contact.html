<a class="skip-link" href="#main">Skip to content</a>
<main id="main">
  <h1 class="t-headline">Talk to our team</h1>
  <form class="stack" action="/contact" method="post">
    <div class="field">
      <label for="email">Work email</label>
      <input id="email" class="input" type="email" name="email" autocomplete="email" required aria-describedby="email-hint">
      <p id="email-hint" class="t-caption t-muted">We reply within one business day.</p>
    </div>
    <div class="field">
      <label for="message">How can we help?</label>
      <textarea id="message" class="input" name="message" rows="4"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Send message</button>
  </form>
  <p class="t-body-small t-muted">Prefer email? Write to <a href="mailto:hello@example.com">hello@example.com</a> or see the <a href="#faq">FAQ</a>.</p>
</main>
