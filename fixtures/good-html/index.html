<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ledgerline: shared household budgets</title>
    <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/page.css">
  </head>
  <body>
    <header class="nav">
      <a href="/" class="brand">Ledgerline</a>
      <a href="#pricing">Pricing</a>
      <button class="btn btn-secondary" type="button" aria-label="Dark theme" data-theme-toggle>
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <main>
      <section class="hero">
        <p class="eyebrow">For households that budget together</p>
        <h1>See every bill before it is due</h1>
        <p class="lede">Shared balances, upcoming bills and who paid what, in one calm view.</p>
        <a class="btn btn-primary" href="#start">Open an account</a>
      </section>
      <img src="statement.png" alt="A monthly statement showing four upcoming bills">
    </main>
  </body>
</html>
