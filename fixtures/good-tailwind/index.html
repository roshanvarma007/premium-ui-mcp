<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ledgerline: statements</title>
    <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
    <link rel="stylesheet" href="css/output.css">
  </head>
  <body class="bg-bg text-text">
    <main class="mx-auto max-w-3xl px-6 py-24">
      <p class="t-label text-text-muted">October statement</p>
      <h1 class="t-display mt-3">$4,266.26 saved</h1>
      <p class="mt-4 text-body text-text-muted">Three bills are due in the next seven days.</p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a href="#pay" class="inline-flex min-h-touch items-center rounded-md bg-accent px-6 text-on-accent focus-visible:outline-2">Pay bills</a>
        <a href="#export" class="inline-flex min-h-touch items-center rounded-md border border-border-strong px-6 text-text">Export PDF</a>
      </div>
      <ul class="mt-12 divide-y divide-border rounded-md border border-border bg-surface">
        <li class="flex items-center justify-between px-6 py-4"><span class="text-body">City Water Utility</span><span class="text-body tabular-nums">$62.75</span></li>
        <li class="flex items-center justify-between px-6 py-4"><span class="text-body">Northside Grocers</span><span class="text-body tabular-nums">$48.20</span></li>
      </ul>
    </main>
  </body>
</html>
